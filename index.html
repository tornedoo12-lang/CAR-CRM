<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة السيارات</title>
<style>
:root{
  color-scheme:light;
  --bg1:#667eea;--bg2:#764ba2;--card:#ffffff;--text:#2c3e50;--muted:#7f8c8d;
  --border:#e5e7eb;--hover:#f5f7fa;--thead:#2c3e50;--thead-text:#ffffff;--input:#ffffff;
  --accent:#3498db;--accent-hover:#2980b9;--danger:#e74c3c;--danger-hover:#c0392b;--gray:#95a5a6;
  --ok-bg:#d4edda;--ok-fg:#155724;--warn-bg:#fff3cd;--warn-fg:#856404;--bad-bg:#f8d7da;--bad-fg:#721c24;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh;padding:20px;color:var(--text)}
.container{max-width:1350px;margin:0 auto}
header{background:var(--card);padding:20px;border-radius:10px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
h1{font-size:26px;flex:1;min-width:200px}
.header-controls{display:flex;gap:8px;flex-wrap:wrap}
button{padding:10px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:background .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:var(--danger);color:#fff}
.btn-gray{background:var(--gray);color:#fff}
.btn-small{padding:6px 12px;font-size:12px}
.btn-github{background:#24292e;color:#fff}
.btn-auth{background:#8e44ad;color:#fff}
.note{padding:11px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;font-weight:600}
.note-ok{background:var(--ok-bg);color:var(--ok-fg)}
.note-warn{background:var(--warn-bg);color:var(--warn-fg)}
.search-bar{display:flex;gap:10px;margin-bottom:16px;background:var(--card);padding:15px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.15);flex-wrap:wrap}
input,select,textarea{padding:10px 14px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;background:var(--input);color:var(--text)}
.search-bar input,.search-bar select{flex:1;min-width:160px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:16px}
.stat-card{background:var(--card);padding:18px;border-radius:10px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.stat-number{font-size:28px;font-weight:700;color:var(--accent)}
.stat-label{color:var(--muted);font-size:12px;margin-top:5px}
.table-container{background:var(--card);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.15);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1100px}
th{background:var(--thead);color:var(--thead-text);padding:13px 12px;text-align:right;font-weight:600;font-size:13px;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:hover td{background:var(--hover)}
.modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.55);align-items:center;justify-content:center}
.modal.active{display:flex}
#pinModal{z-index:3000;background:rgba(15,18,30,.95)}
.modal-content{background:var(--card);padding:26px;border-radius:10px;width:92%;max-width:480px}
.form-group{margin-bottom:13px}
.form-group label{display:block;margin-bottom:5px;font-weight:600;font-size:13px}
.form-group input,.form-group select{width:100%}
.modal-footer{display:flex;gap:10px;margin-top:18px}
.confirm-box{text-align:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c3e50;color:#fff;padding:11px 20px;border-radius:8px;font-size:14px;z-index:4000;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🚗 نظام إدارة السيارات</h1>
    <div class="header-controls">
      <button class="btn-primary" id="addBtn">+ إضافة سيارة</button>
      <button class="btn-auth" id="changePinBtn">🔐 تغيير الرقم السري</button>
      <button class="btn-github" id="githubConfigBtn">🐙 إعداد ربط GitHub</button>
    </div>
  </header>

  <div id="backupNote" class="note" role="status"></div>

  <div class="stats">
    <div class="stat-card"><div class="stat-number" id="stTotal">0</div><div class="stat-label">إجمالي السيارات</div></div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>السيارة</th><th>رقم اللوحة</th><th>شركة التأمين</th><th>الإجراءات</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- نافذة إعدادات GitHub -->
<div id="githubModal" class="modal">
  <div class="modal-content" style="max-width:500px">
    <h2>🐙 ربط الحفظ المباشر مع GitHub</h2>
    <div class="form-group"><label>اسم المستخدم (Owner)</label><input type="text" id="ghOwner" dir="ltr"></div>
    <div class="form-group"><label>اسم المستودع (Repo)</label><input type="text" id="ghRepo" dir="ltr"></div>
    <div class="form-group"><label>رمز الوصول (Token)</label><input type="password" id="ghToken" dir="ltr"></div>
    <div class="modal-footer">
      <button type="button" class="btn-primary" id="saveGithubConfig">حفظ الاتصال وجلب البيانات</button>
      <button type="button" class="btn-danger" id="closeGithubModal">إغلاق</button>
    </div>
  </div>
</div>

<!-- نافذة الأمان والرمز السري -->
<div id="pinModal" class="modal active">
  <div class="modal-content confirm-box">
    <h2 id="pinTitle">🔒 تسجيل الدخول</h2>
    <p id="pinSubMsg" style="margin-bottom:15px;color:var(--muted)">أدخل الرقم السري للمتابعة</p>
    
    <div id="viewLoginPin">
      <div class="form-group">
        <input type="password" id="inputLoginPin" placeholder="أدخل الرقم السري" dir="ltr" style="text-align:center;font-size:20px;letter-spacing:5px;" autocomplete="off">
      </div>
      <div class="modal-footer" style="flex-direction:column;">
        <button type="button" class="btn-primary" id="btnLoginPin" style="width:100%;">دخول</button>
        <button type="button" class="btn-gray btn-small" id="btnForgotPin" style="margin-top:8px;background:none;color:var(--accent);">نسيت الرقم السري؟</button>
      </div>
    </div>

    <div id="viewSetupPin" style="display:none;text-align:right;">
      <div class="form-group"><label>الرقم السري الجديد *</label><input type="password" id="inputNewPin" dir="ltr" autocomplete="off"></div>
      <div class="form-group"><label>سؤال الأمان *</label><select id="selectSecurityQuestion"><option value="ما هو اسم أول مدرسة درست فيها؟">ما هو اسم أول مدرسة درست فيها؟</option></select></div>
      <div class="form-group"><label>إجابة سؤال الأمان *</label><input type="text" id="inputSecurityAnswer" autocomplete="off"></div>
      <div class="modal-footer"><button type="button" class="btn-primary" id="btnSavePinSetup" style="width:100%;">حفظ وتعيين</button></div>
    </div>

    <div id="viewResetPin" style="display:none;text-align:right;">
      <div class="form-group"><label id="lblSecurityQuestion" style="color:var(--accent);"></label><input type="text" id="inputResetAnswer" autocomplete="off"></div>
      <div class="modal-footer"><button type="button" class="btn-primary" id="btnVerifyReset" style="width:100%;">التحقق</button></div>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
const AUTH_KEY = 'cars_crm_auth_pin_v1';
const GH_KEY = 'cars_crm_github_config_v1';
const LOCAL_KEY = 'cars_crm_local_data';
const $ = id => document.getElementById(id);

let authConfig = { pin: '', question: '', answer: '' };
let ghConfig = { owner: '', repo: '', path: 'cars-data.json', token: '' };
let cars = [];

function loadAuthConfig(){
  try { const d = localStorage.getItem(AUTH_KEY); if(d) authConfig = JSON.parse(d); } catch(e){}
}
function saveAuthConfig(){
  try { localStorage.setItem(AUTH_KEY, JSON.stringify(authConfig)); } catch(e){}
}
function loadLocalCars(){
  try { const d = localStorage.getItem(LOCAL_KEY); if(d) cars = JSON.parse(d); } catch(e){}
}
function saveLocalCars(){
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(cars)); } catch(e){}
}

function checkLoginState(){
  loadAuthConfig();
  if(!authConfig.pin){
    $('pinTitle').textContent = '🔑 إنشاء رقم سري أول مرة';
    $('viewLoginPin').style.display = 'none';
    $('viewSetupPin').style.display = 'block';
  } else {
    $('pinTitle').textContent = '🔒 تسجيل الدخول';
    $('viewLoginPin').style.display = 'block';
    $('viewSetupPin').style.display = 'none';
  }
}

// جلب البيانات من GitHub تلقائياً إذا كان متصلاً
async function fetchFromGithub(){
  if(!ghConfig.token || !ghConfig.owner || !ghConfig.repo) return;
  try{
    const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${ghConfig.path}`;
    const res = await fetch(url, { headers: { 'Authorization': `Bearer ${ghConfig.token}`, 'Accept': 'application/vnd.github+json' } });
    if(res.ok){
      const json = await res.json();
      const content = decodeURIComponent(escape(atob(json.content)));
      const parsed = JSON.parse(content);
      cars = Array.isArray(parsed) ? parsed : (parsed.cars || []);
      saveLocalCars();
      render();
      toast('☁️ تم استعادة بيانات السيارات من GitHub بنجاح');
    }
  }catch(e){ console.warn(e); }
}

$('btnLoginPin').onclick = () => {
  const val = $('inputLoginPin').value.trim();
  if(val === authConfig.pin){
    $('pinModal').classList.remove('active');
    loadLocalCars();
    render();
    if(ghConfig.token) fetchFromGithub();
    toast('تم تسجيل الدخول بنجاح');
  } else {
    toast('الرقم السري غير صحيح');
    $('inputLoginPin').value = '';
  }
};

$('inputLoginPin').onkeypress = (e) => { if(e.key === 'Enter') $('btnLoginPin').click(); };

$('btnSavePinSetup').onclick = () => {
  const newPin = $('inputNewPin').value.trim();
  const ans = $('inputSecurityAnswer').value.trim();
  if(!newPin || !ans){ toast('يرجى تعبئة جميع الحقول المطلوبة'); return; }
  authConfig = { pin: newPin, question: $('selectSecurityQuestion').value, answer: ans };
  saveAuthConfig();
  $('pinModal').classList.remove('active');
  loadLocalCars();
  render();
  toast('تم حفظ الرقم السري بنجاح');
};

$('btnForgotPin').onclick = () => {
  $('viewLoginPin').style.display = 'none';
  $('viewResetPin').style.display = 'block';
  $('lblSecurityQuestion').textContent = authConfig.question || 'سؤال الأمان';
};

$('btnVerifyReset').onclick = () => {
  const ans = $('inputResetAnswer').value.trim();
  if(ans === authConfig.answer){
    $('viewResetPin').style.display = 'none';
    $('viewSetupPin').style.display = 'block';
    $('pinTitle').textContent = '🔑 تعيين رقم سري جديد';
  } else { toast('إجابة سؤال الأمان غير صحيحة'); }
};

$('changePinBtn').onclick = () => {
  $('pinModal').classList.add('active');
  $('viewLoginPin').style.display = 'none';
  $('viewSetupPin').style.display = 'block';
  $('pinTitle').textContent = '🔐 تغيير الرقم السري';
};

$('githubConfigBtn').onclick = () => {
  try {
    const c = JSON.parse(localStorage.getItem(GH_KEY) || '{}');
    if(c.token){ $('ghOwner').value = c.owner; $('ghRepo').value = c.repo; $('ghToken').value = c.token; }
  }catch(e){}
  $('githubModal').classList.add('active');
};
$('closeGithubModal').onclick = () => $('githubModal').classList.remove('active');

$('saveGithubConfig').onclick = async () => {
  ghConfig.owner = $('ghOwner').value.trim();
  ghConfig.repo = $('ghRepo').value.trim();
  ghConfig.token = $('ghToken').value.trim();
  localStorage.setItem(GH_KEY, JSON.stringify(ghConfig));
  $('githubModal').classList.remove('active');
  toast('جاري جلب البيانات من GitHub...');
  await fetchFromGithub();
};

$('addBtn').onclick = () => {
  const name = prompt('أدخل نوع السيارة:');
  const plate = prompt('أدخل رقم اللوحة:');
  const ins = prompt('أدخل شركة التأمين:');
  if(name && plate){
    cars.push({carName: name, plateNumber: plate, insurance: ins || ''});
    saveLocalCars();
    render();
    toast('تمت الإضافة بنجاح');
  }
};

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function render(){
  $('stTotal').textContent = cars.length;
  const tb = $('tableBody');
  if(!cars.length){
    tb.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--muted)">لا توجد سيارات مسجلة. اضغط على "+ إضافة سيارة" أو اربط GitHub لجلب بياناتك.</td></tr>';
    return;
  }
  tb.innerHTML = cars.map(c => `<tr><td>${c.carName || ''}</td><td>${c.plateNumber || ''}</td><td>${c.insurance || ''}</td><td>-</td></tr>`).join('');
}

checkLoginState();
loadLocalCars();
render();
</script>
</body>
</html>
