<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<style>
:root{
  color-scheme:light;
  --bg1:#667eea;--bg2:#764ba2;--card:#ffffff;--text:#2c3e50;--muted:#7f8c8d;
  --border:#e5e7eb;--hover:#f5f7fa;--thead:#2c3e50;--thead-text:#ffffff;--input:#ffffff;
  --accent:#3498db;--accent-hover:#2980b9;--danger:#e74c3c;--danger-hover:#c0392b;--gray:#95a5a6;
  --gh:#24292f;--gh-hover:#1b1f23;--excel:#1d6f42;--excel-hover:#155732;--row-bad:rgba(231,76,60,.07);
  --ok-bg:#d4edda;--ok-fg:#155724;--warn-bg:#fff3cd;--warn-fg:#856404;--bad-bg:#f8d7da;--bad-fg:#721c24;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg1:#1b1f3b;--bg2:#2a1d3d;--card:#1e2230;--text:#e8eaf0;--muted:#9aa3b2;
    --border:#333a4d;--hover:#262b3b;--thead:#11141f;--thead-text:#e8eaf0;--input:#161a26;
    --gh:#2f363d;--gh-hover:#444d56;--excel:#21884f;--excel-hover:#196c3e;--row-bad:rgba(231,76,60,.14);
    --ok-bg:rgba(46,204,113,.18);--ok-fg:#7be0a3;--warn-bg:rgba(243,156,18,.2);--warn-fg:#f5c76b;--bad-bg:rgba(231,76,60,.22);--bad-fg:#ff9b90;
  }
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh;padding:20px;color:var(--text)}
.container{max-width:1350px;margin:0 auto}
header{background:var(--card);padding:20px;border-radius:10px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
h1{font-size:26px;flex:1;min-width:200px}
.header-controls{display:flex;gap:8px;flex-wrap:wrap}
button{padding:10px 16px;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;transition:background .2s, opacity .2s}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-hover)}
.btn-excel{background:var(--excel);color:#fff}
.btn-excel:hover:not(:disabled){background:var(--excel-hover)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){background:var(--danger-hover)}
.btn-gray{background:var(--gray);color:#fff}
.btn-gh{background:var(--gh);color:#fff}
.btn-gh:hover:not(:disabled){background:var(--gh-hover)}
.btn-small{padding:6px 12px;font-size:12px}
.note{padding:11px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.note-ok{background:var(--ok-bg);color:var(--ok-fg)}
.note-warn{background:var(--warn-bg);color:var(--warn-fg)}
.note-bad{background:var(--bad-bg);color:var(--bad-fg)}
.search-bar{display:flex;gap:10px;margin-bottom:16px;background:var(--card);padding:15px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.15);flex-wrap:wrap}
input,select,textarea{padding:10px 14px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;background:var(--input);color:var(--text)}
.search-bar input,.search-bar select{flex:1;min-width:160px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:14px}
.stat-card{background:var(--card);padding:18px;border-radius:10px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.stat-number{font-size:28px;font-weight:700;color:var(--accent)}
.stat-number.bad{color:var(--danger)}
.stat-number.warn{color:#f39c12}
.stat-label{color:var(--muted);font-size:12px;margin-top:5px}
.table-container{background:var(--card);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.15);overflow-x:clip}
@media(max-width:1150px){.table-container{overflow:auto;max-height:80vh}}
table{width:100%;border-collapse:collapse;min-width:1100px}
th{background:var(--thead);color:var(--thead-text);padding:13px 12px;text-align:right;font-weight:600;font-size:13px;white-space:nowrap}
thead th{position:sticky;top:0;z-index:98}
thead th:first-child{border-top-right-radius:10px}
thead th:last-child{border-top-left-radius:10px}
